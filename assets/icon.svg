    <path d="M272.1 102.8 A154 154 0 0 1 409.2 239.9" stroke="#d8b4fe"/>
    <path d="M409.2 272.1 A154 154 0 0 1 272.1 409.2" stroke="#a855f7"/>
    <path d="M239.9 409.2 A154 154 0 0 1 102.8 272.1" stroke="#7c3aed"/>
    <path d="M102.8 239.9 A154 154 0 0 1 239.9 102.8" stroke="#c084fc"/>
  </g>

  <g transform="translate(256 256)">
    <circle r="57" fill="url(#core)" filter="url(#glow)"/>
    <circle r="63" fill="none" stroke="#f5f3ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="109" cy="-109" r="12" fill="#f5f3ff" filter="url(#glow)"/>
